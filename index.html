<html lang="en">
<head>

<style>
:root{--bg:#ffffff;--ink:#222222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Caveat','Patrick Hand',cursive;color:var(--ink)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;height:var(--vh,100dvh)}
#phone{position:relative;width:100%;height:100vh;height:100dvh;height:var(--vh,100dvh);overflow:hidden;background:var(--bg);transition:background .3s}
@media (min-width:600px){
  html,body{background:#d9d9de;display:flex;align-items:center;justify-content:center}
  #phone{height:min(844px,96vh);width:auto;aspect-ratio:390/844;border:10px solid #111;border-radius:52px;box-shadow:0 20px 60px #0003}
  #phone::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:100px;height:28px;border-radius:16px;background:#111;z-index:9}
  #draw .logo{top:52px!important}
  .dot{top:60px!important}
}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.screen{position:absolute;inset:0;pointer-events:none}
.screen[hidden]{display:none}
.screen>*{pointer-events:auto}
.logo{position:absolute;top:calc(14px + env(safe-area-inset-top));left:20px;font-size:34px;font-weight:700}
.lang{position:absolute;top:calc(11px + env(safe-area-inset-top));right:54px;background:none;border:0;padding:4px 8px;font-size:30px;font-weight:700;line-height:1;z-index:3;color:var(--ink)}
.dot{position:absolute;top:calc(22px + env(safe-area-inset-top));right:20px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:0;padding:0;z-index:3}
.bottom{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;padding:0 14px}
.ico{background:none;border:0;padding:8px;cursor:pointer;line-height:0}
.ico svg{width:46px;height:46px;stroke:var(--ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico:active{opacity:.4;transform:scale(.9)}
.oval{width:92px;height:150px;border:3px solid var(--ink);border-radius:48% 52% 50% 50% / 38% 40% 60% 62%;background:none;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.oval:active{transform:scale(.95)}
/* result card = full screen */
#out{position:absolute;inset:0;width:100%;height:100%;display:block}
#busy{position:absolute;inset:0;background:var(--bg);opacity:.92;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;z-index:5}
#busy[hidden]{display:none}

#sheet[hidden],#imgv[hidden]{display:none}
#sheet{position:absolute;inset:0;z-index:20;background:#0006;display:flex;align-items:flex-end}
.sh{width:100%;padding:26px 10px calc(26px + env(safe-area-inset-bottom));background:#fffdf5;border-radius:30px 30px 0 0;display:flex;justify-content:space-around;box-shadow:0 -10px 40px #0003}
.sh button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:25px;font-weight:700;color:#3a3a4a;padding:4px 6px;line-height:1}
.sh svg{width:50px;height:50px;stroke:#3a3a4a;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#imgv{position:absolute;inset:0;z-index:30;background:#111;display:flex;align-items:center;justify-content:center}
#imgv img{max-width:100%;max-height:100%;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:manipulation}
#imgv .x{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:44px;height:44px;background:#0006;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
#imgv .x svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}

#tour{position:absolute;inset:0;z-index:40;overflow:hidden}
#tour *{font-family:var(--tf),cursive;color:#3a3a4a}
#tour .hole{position:absolute;border-radius:26px;box-shadow:0 0 0 2400px rgba(12,12,40,.64);border:3px dashed #fffc;transition:left .35s,top .35s,width .35s,height .35s}
#tour .bub{position:absolute;background:#fffdf5;border:3px solid #3a3a4a;border-radius:28px 32px 26px 34px;padding:16px 18px 14px 16px;box-shadow:0 10px 30px #0005;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
#tour .bub .in{animation:bob 1.8s ease-in-out infinite;display:block}
#tour .top{display:flex;align-items:center;gap:12px}
#tour .mas{width:54px;height:54px;flex:none;animation:wave 1.4s ease-in-out infinite}
#tour .mas svg{width:100%;height:100%}
#tour .tt{font-size:26px;font-weight:700;line-height:1.25;padding-right:18px}
#tour .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
#tour .dots{display:flex;gap:7px}
#tour .dots i{width:10px;height:10px;border-radius:50%;background:#3a3a4a33}
#tour .dots i.on{background:#e8657f}
#tour .nx{background:none;border:0;display:flex;align-items:center;gap:6px;font-size:25px;font-weight:700;padding:2px 4px}
#tour .nx svg{width:30px;height:30px;stroke:#e8657f;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
#tour .cl{position:absolute;top:-14px;right:-12px;width:34px;height:34px;border-radius:50%;background:#fffdf5;border:3px solid #3a3a4a;padding:0;display:flex;align-items:center;justify-content:center}
#tour .cl svg{width:16px;height:16px;stroke:#3a3a4a;fill:none;stroke-width:3.4;stroke-linecap:round}
#tour .tail{position:absolute;width:22px;height:22px;background:#fffdf5;border:3px solid #3a3a4a;transform:rotate(45deg)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-3px)}}
</style>

<button data-a="share"><svg viewBox="0 0 48 48"><path d="M7 24L41 8L31 41L23 29Z"/><path d="M23 29L41 8"/></svg><span></span></button>
<button data-a="save"><svg viewBox="0 0 48 48"><path d="M24 7C25 17 23 24 24 31"/><path d="M15 23L24 32L33 22"/><path d="M9 33C9 41 12 42 24 42C36 42 39 41 39 33"/></svg><span></span></button>
<button data-a="line"><svg viewBox="0 0 48 48"><path d="M24 8C13 8 6 15 6 23C6 30 12 35 19 36L19 42L26 36C36 35 42 29 42 23C42 15 35 8 24 8Z"/><path d="M16 22L32 22"/></svg><span></span></button>
<button data-a="copy"><svg viewBox="0 0 48 48"><path d="M17 17L38 17L38 41L17 41Z"/><path d="M12 33L10 33L10 8L31 8L31 11"/></svg><span></span></button>
</div></div>

</div>
<script>
// ===== Config: Edge Function on the UTRA Supabase project =====
const SUPABASE_URL = 'https://iuwomesavaagifvhokkt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1d29tZXNhdmFhZ2lmdmhva2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjc4MzAsImV4cCI6MjA5OTYwMzgzMH0.4JeKzdoOdLCl0AKD5WoHprxu_3Gt_6rGUzLLxFw-UO8';
const FUNCTION_NAME = 'miracle';

let lang='en';try{lang=localStorage.getItem('mr_lang')||'en'}catch(e){}
const LANGS=['en','zh','ja'],LBL={en:'EN',zh:'中',ja:'日'},BUSY={en:'dreaming...',zh:'靜靜醞釀中…',ja:'夢を描いています…'},ERR={en:'please try again',zh:'請再試一次',ja:'もう一度お試しください'};
const LANGF={zh:['LXGW WenKai TC',[700,400]],ja:['Klee One',[600,400]]};
const loadF=(f,t)=>Promise.all([700,600,500,400].map(w=>document.fonts.load(`${w} 80px "${f}"`,t||'')));
function poemOf(){const P=window._poems;return (P&&(P[lang]||P.en))||lastPoem}
async function setLang(l){
  lang=l;try{localStorage.setItem('mr_lang',l)}catch(e){}
  document.querySelectorAll('.lang').forEach(b=>b.textContent=LBL[l]);$('busy').textContent=BUSY[l];
  if(window._img&&window._redraw&&window._poems){const t=poemOf();try{await loadF(LANGF[l]?LANGF[l][0]:(FONTS[(window._design||{}).font]?window._design.font:'Caveat'),t)}catch(e){}compose(window._img,t)}
}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(LANGS[(LANGS.indexOf(lang)+1)%3]));
const POEMS = [
  "Hope starts small.\nEven the smallest line\nholds a whole sky.\nYou just drew yours.",
  "You made light.\nOne gentle stroke,\none quiet spark,\nand the world answered back.",
  "Your heart blooms.\nEvery heart has a garden.\nToday, you watered yours\nwithout even knowing.",
  "Soft days shine.\nGrey mornings pass,\nstars stay patient,\nand so do you.",
  "Begin again.\nNo rush, no rules,\njust a pencil and a feeling.\nThat is already a miracle.",
  "Be your story.\nWhatever you feel today,\nit is welcome here,\nand it is beautiful."
];
const THEMES = [
  {bg:'#ffffff',ink:'#222222'},
  {bg:'#154c3c',ink:'#e8f5ec'},
  {bg:'#7ec8ff',ink:'#12304a'},
  {bg:'#c8f5e0',ink:'#a02c2c'}
];
const INKS = ['#3b4a6b','#b5384f','#f4f1e4','#5a3d1e','#1d4e89','#4a3320','#5b4a8a','#2f6b55','#c4543a','#f4f1e4','#7a3fa0','#a8456a','#17667a','#2d4f9e','#9a4a1c'];
const $ = id => document.getElementById(id);
const pad = $('pad'), ctx = pad.getContext('2d'), box = $('phone');
const BW=()=>box.clientWidth, BH=()=>box.clientHeight;
let ti = 0, tpl = 0, strokes = [], cur = null, lastPoem = '';

function applyTheme(){
  const t = THEMES[ti];
  document.documentElement.style.setProperty('--bg', t.bg);
  document.documentElement.style.setProperty('--ink', t.ink);
  redraw();
}
$('theme').onclick = () => { ti = (ti + 1) % THEMES.length; applyTheme(); };
$('theme2').onclick = () => { tpl = (tpl + 1) % TPLS.length; if(window._redraw){const ls=['stack','poster','quote','ribbon','note'],d=window._design||(window._design={});d.layout=ls[(ls.indexOf(d.layout)+1)%5];d.align=['left','center','right'][tpl%3]} compose(window._img||null, lastPoem); };

function setVh(){document.documentElement.style.setProperty('--vh',(window.visualViewport?visualViewport.height:innerHeight)+'px')}
function fit(){setVh();const d=devicePixelRatio||1;pad.width=BW()*d;pad.height=BH()*d;redraw()}
function redraw(){
  const d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,pad.width,pad.height);
  ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle=THEMES[ti].ink;ctx.lineWidth=3;
  strokes.forEach(s=>{ctx.beginPath();s.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
    if(s.length==1)ctx.lineTo(s[0].x+.1,s[0].y);ctx.stroke()});
}
addEventListener('resize',fit);
const pt=e=>{const r=pad.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
['touchmove','gesturestart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);redraw()};
pad.onpointermove=e=>{if(!cur)return;cur.push(pt(e));redraw()};
pad.onpointerup=pad.onpointercancel=()=>{cur=null};
$('undo').onclick=()=>{strokes.pop();redraw()};
$('clear').onclick=()=>{strokes=[];redraw()};

// crop the doodle (with margin), send dark lines on white; remember the crop so the original lines can be laid back on top
function snapshot(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(s=>s.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)}));
  const PW=576,PH=1024,bw=Math.max(x1-x0,40),bh=Math.max(y1-y0,40);
  const bx=PW*.12,by=PH*.09,bW=PW*.76,bH=PH*.56,s=Math.min(bW/bw,bH/bh);
  const ox=bx+(bW-bw*s)/2-x0*s,oy=by+(bH-bh*s)/2-y0*s;
  const t=document.createElement('canvas');t.width=PW;t.height=PH;const x=t.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,PW,PH);
  x.strokeStyle='#222';x.lineWidth=7;x.lineCap=x.lineJoin='round';
  strokes.forEach(st=>{x.beginPath();st.forEach((q,i)=>i?x.lineTo(q.x*s+ox,q.y*s+oy):x.moveTo(q.x*s+ox,q.y*s+oy));
    if(st.length==1)x.lineTo(st[0].x*s+ox+.1,st[0].y*s+oy);x.stroke()});
  window._crop={pw:PW,ph:PH};
  return t.toDataURL('image/png');
}

// ===== Miracle =====
$('miracle').onclick=async()=>{
  if(!strokes.length)return;
  $('busy').hidden=false;
  try{
    let img=null,poem=POEMS[Math.floor(Math.random()*POEMS.length)];
    if(SUPABASE_URL){
      const res=await fetch(`${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`,{method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+SUPABASE_ANON_KEY},
        body:JSON.stringify((()=>{const image=snapshot();return{image,width:window._crop.pw,height:window._crop.ph}})())});
      const j=await res.json();
      if(!j.image&&!j.svg)throw new Error(j.error||'fail');
      window._poems=j.poems||{en:j.poem||poem};poem=poemOf()||poem;
      img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=j.image||('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(j.svg))});window._redraw=!!j.image;window._design=j.design||{};try{const f=LANGF[lang]?LANGF[lang][0]:(FONTS[window._design.font]?window._design.font:'Caveat');await loadF(f,poemOf())}catch(e){}
    }else await new Promise(r=>setTimeout(r,1200));
    window._img=img;tpl=Math.floor(Math.random()*TPLS.length);
    compose(img,poem);
    pad.style.display='none';$('draw').hidden=true;$('result').hidden=false;setTimeout(()=>runTour('result'),900);
  }catch(err){alert(ERR[lang])}
  $('busy').hidden=true;
};

// ===== Hand-drawn engine =====
let W=1080,H=2340,_s=1;
let F='Caveat, cursive';
const FONTS={'Caveat':[700,500],'Dancing Script':[700,500],'Shadows Into Light':[400,400],'Gloria Hallelujah':[400,400],'Amatic SC':[700,400],'Indie Flower':[400,400],'Kalam':[700,400],'Pacifico':[400,400],'Satisfy':[400,400]};
const R=()=>{_s=(_s*16807)%2147483647;return _s/2147483647};
const rs=(a,b)=>a+(b-a)*R();
function trace(c,q,close){
  c.beginPath();const n=q.length;
  if(close){c.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);
    for(let i=0;i<n;i++){const a=q[i],b=q[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}c.closePath()}
  else{c.moveTo(q[0][0],q[0][1]);
    for(let i=1;i<n-1;i++){const a=q[i],b=q[i+1];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
    c.lineTo(q[n-1][0],q[n-1][1])}
}
// wobbly pencil line through points
function wl(c,p,col,w,al,close,fill){
  const j=w*.45,q=p.map(a=>[a[0]+rs(-j,j),a[1]+rs(-j,j)]);
  c.save();c.lineCap=c.lineJoin='round';trace(c,q,close);
  if(fill){c.globalAlpha=1;c.fillStyle=fill;c.fill()}
  c.globalAlpha=al==null?1:al;c.strokeStyle=col;c.lineWidth=w;c.stroke();c.restore();
}
function line(c,x1,y1,x2,y2,col,w,al){
  const d=Math.hypot(x2-x1,y2-y1),n=Math.max(3,Math.round(d/70)),p=[];
  for(let i=0;i<=n;i++)p.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n]);
  wl(c,p,col,w,al);wl(c,p,col,w*.55,(al==null?1:al)*.55);
}
function oval(c,cx,cy,rx,ry,col,w,fill,al){
  for(let k=0;k<2;k++){const a0=R()*6.28,p=[];
    for(let i=0;i<16;i++){const a=a0+i/16*6.28,r=1+rs(-.03,.03);p.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}
    wl(c,p,col,k?w*.55:w,al,true,k?null:fill)}
}
function rectW(c,x,y,w,h,col,wd,fill,al){
  const p=[],n=Math.max(2,Math.round(w/110)),m=Math.max(2,Math.round(h/110));
  for(let i=0;i<n;i++)p.push([x+w*i/n,y]);for(let i=0;i<m;i++)p.push([x+w,y+h*i/m]);
  for(let i=0;i<n;i++)p.push([x+w-w*i/n,y+h]);for(let i=0;i<m;i++)p.push([x,y+h-h*i/m]);
  wl(c,p,col,wd,al,true,fill);
}
function blob(c,cx,cy,rx,ry,col,al){
  for(let k=0;k<3;k++){const p=[],n=18,sc=1-k*.18;
    for(let i=0;i<n;i++){const a=i/n*6.28;p.push([cx+Math.cos(a)*rx*sc*rs(.8,1.1),cy+Math.sin(a)*ry*sc*rs(.8,1.1)])}
    c.save();c.globalAlpha=al*(k?.5:1);c.fillStyle=col;trace(c,p,true);c.fill();
    if(!k){c.globalAlpha=al*.7;c.strokeStyle=col;c.lineWidth=5;c.stroke()}c.restore()}
}
function paper(c,base,speck,dens){
  c.fillStyle=base;c.fillRect(0,0,W,H);
  c.fillStyle=speck;
  for(let i=0;i<(dens||2600);i++){c.globalAlpha=rs(.03,.1);c.fillRect(R()*W,R()*H,rs(1,3),rs(1,3))}
  c.globalAlpha=1;
}
function star(c,x,y,r,col,w,fill){const p=[];for(let i=0;i<10;i++){const a=-1.57+i*.628,rr=i%2?r*.45:r;p.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}wl(c,p,col,w,1,true,fill)}
function heart(c,x,y,s,col,w,fill){const p=[];for(let t=0;t<6.28;t+=.3){

// AI picture fills the whole card; the poem is typeset on its calm lower part, with a font + layout chosen for THIS picture
function lumOf(c,y0,h){const d=c.getImageData(0,Math.floor(y0),W,Math.floor(h)).data;let l=0,n=0;for(let i=0;i<d.length;i+=64){l+=.299*d[i]+.587*d[i+1]+.114*d[i+2];n++}return l/(n*255)}
function fullCard(c,img,L){
  const sc=Math.max(W/img.width,H/img.height),iw=img.width*sc,ih=img.height*sc;
  c.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);

  const lay=['stack','poster','quote','ribbon','note'].includes(d.layout)?d.layout:'stack',al=['left','center','right'].includes(d.align)?d.align:'center';
  const dk=lumOf(c,H*.68,H*.28)>.52,ink=dk?'#2b2d42':'#ffffff',glow=dk?'#ffffffcc':'#000000aa',paperInk='#3a3a4a';
  const sigInk=lumOf(c,0,H*.09)>.52?'#2b2d42':'#ffffff',navInk=lumOf(c,H*.9,H*.1)>.52?'#2b2d42':'#ffffff';
  const gr=c.createLinearGradient(0,H*.6,0,H);gr.addColorStop(0,'#0000');gr.addColorStop(1,dk?'#ffffff55':'#00000055');c.fillStyle=gr;c.fillRect(0,H*.6,W,H*.4);
  const x=al==='left'?90:al==='right'?W-90:W/2,M=W-180;
  c.save();c.shadowColor=sigInk==='#ffffff'?'#000a':'#fffc';c.shadowBlur=22;tx(c,'miracle.',64,H*.052,50,700,sigInk,'left');c.restore();
  const row=(t,xx,yy,sz,wt,col,a,mw)=>tx(c,t,xx,yy,sz,wt,col,a,mw||M);
  c.save();c.shadowColor=glow;c.shadowBlur=26;
  const LIM=H*.855;/* nothing below this line: the nav icons live under it */
  if(lay==='stack'){const y=LIM-285;row(L[0],x,y,150,hw,ink,al);[1,2,3].forEach(i=>row(L[i],x,y+105+(i-1)*84,60,bw,ink,al))}
  else if(lay==='poster'){const y=LIM-292;try{c.letterSpacing='9px'}catch(e){}row(L[0].toUpperCase(),x,y,92,hw,ink,al);try{c.letterSpacing='0px'}catch(e){}
    const x1=al==='left'?90:al==='right'?W-390:W*.32,x2=al==='left'?390:al==='right'?W-90:W*.68;c.save();c.shadowBlur=0;line(c,x1,y+34,x2,y+34,ink,4,.9);c.restore();
    [1,2,3].forEach(i=>row(L[i],x,y+112+(i-1)*84,62,bw,ink,al))}
  else if(lay==='quote'){const y=LIM-320;c.save();c.shadowBlur=0;sparkle(c,W/2,y-(lang==='en'?92:150),30,ink,5);c.restore();
    row(L[0],W/2,y,108,hw,ink,'center');[1,2,3].forEach(i=>row(L[i],W/2,y+92+(i-1)*88,70,bw,ink,'center'))}
  else if(lay==='ribbon'){const by=LIM-470,tx0=al==='left'?100:al==='right'?W-100:W/2;c.save();c.shadowColor='#0004';c.shadowBlur=18;c.shadowOffsetY=8;rectW(c,60,by,W-120,170,paperInk,5,'#fffdf5ee');c.restore();
    c.save();c.shadowBlur=0;row(L[0],tx0,by+118,120,hw,paperInk,al,W-240);c.restore();
    [1,2,3].forEach(i=>row(L[i],x,by+290+(i-1)*84,62,bw,ink,al))}
  else{const bh=410,by=LIM-bh;c.save();c.shadowColor='#0004';c.shadowBlur=22;c.shadowOffsetY=10;rectW(c,60,by,W-120,bh,paperInk,4,'#fffdf5f2');c.restore();
    c.save();c.shadowBlur=0;tape(c,W/2,by,200,52,-.05,'#ffb4a2aa');row(L[0],110,by+120,118,hw,paperInk,'left',W-220);
    [1,2,3].forEach(i=>row(L[i],110,by+205+(i-1)*72,56,bw,paperInk,'left',W-220));c.restore()}
  c.restore();

}
function compose(img,poem){
  lastPoem=poem;
  const L=poem.split('\n').filter(Boolean);while(L.length<4)L.push('');
  const o=$('out');W=1080;H=Math.round(W*BH()/BW());o.width=W;o.height=H;
  const top=H*.105,bot=H*.875,avail=bot-top,s=Math.min(W*.78,avail-620),y0=top+(avail-(s+600))/2;
  const g={s,x0:(W-s)/2,y0,ty:y0+s+120};
  _s=tpl*977+13;
  if(img&&window._redraw){document.documentElement.style.setProperty('--ink',fullCard(o.getContext('2d'),img,L));return}
  TPLS[tpl](o.getContext('2d'),img,L,g);
  document.documentElement.style.setProperty('--ink',INKS[tpl]);
}

// ===== Save / Share (the screen-size card itself) =====
const blob_=()=>new Promise(r=>$('out').toBlob(r,'image/png'));
const SH={en:['Share','Save image','LINE','Copy link'],zh:['分享','存圖','LINE','複製連結'],ja:['シェア','画像を保存','LINE','リンクをコピー']};
const JOY={en:'I made a little miracle today. Sending you some hope. Draw yours back?',zh:'我今天畫了一個小小的奇蹟，把一點希望送給你。你也畫一幅回我好嗎？',ja:'今日、小さな奇跡を描きました。あなたにも希望を。あなたの奇跡も見せてね。'};
let shText='';
const pageUrl=()=>location.origin+location.pathname;
const fileOf=async()=>new File([await blob_()],'my-miracle.png',{type:'image/png'});
function openSheet(text){shText=text;document.querySelectorAll('#sheet button').forEach((b,i)=>b.querySelector('span').textContent=SH[lang][i]);$('sheet').hidden=false}
async function showImg(){$('imgv').querySelector('img').src=URL.createObjectURL(await blob_());$('imgv').hidden=false}
const desktop=()=>!matchMedia('(pointer:coarse)').matches;
async function saveImg(){if(desktop()){const a=document.createElement('a');a.href=URL.createObjectURL(await blob_());a.download='my-miracle.png';a.click()}else await showImg()}
async function doShare(){
  const f=await fileOf();
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:shText});return}
    if(navigator.share){await navigator.share({text:shText,url:pageUrl()});return}}catch(e){if(e&&e.name==='AbortError')return}
  await saveImg();
}
$('sheet').onclick=async e=>{
  const b=e.target.closest('button');if(!b){if(e.target===$('sheet'))$('sheet').hidden=true;return}
  const a=b.dataset.a;
  if(a==='share'){$('sheet').hidden=true;await doShare()}
  else if(a==='save'){$('sheet').hidden=true;await saveImg()}
  else if(a==='line'){$('sheet').hidden=true;location.href='https://line.me/R/msg/text/?'+encodeURIComponent(shText+' '+pageUrl())}
  else if(a==='copy'){try{await navigator.clipboard.writeText(shText+' '+pageUrl());b.querySelector('span').textContent='✓'}catch(er){}setTimeout(()=>{$('sheet').hidden=true},700)}
};
$('imgv').querySelector('.x').onclick=()=>{$('imgv').hidden=true};
$('save').onclick=()=>saveImg();
$('share').onclick=()=>openSheet(lastPoem.replace(/\n/g,' · '));
$('joy').onclick=()=>openSheet(JOY[lang]);
$('again').onclick=()=>{strokes=[];window._img=null;$('result').hidden=true;$('draw').hidden=false;pad.style.display='block';applyTheme();fit()};

const TOUR={
 en:{pad:'Draw anything you feel, right here on the blank space',lang:'Pick your language here',go:'Done drawing? Press here and a little miracle appears',bar:'Save it, share it, or send joy to a friend',dot:'Tap this dot to change the text design',next:'Next',ok:'Got it'},

function runTour(kind){
  if(tget('off')||tget(kind)||tourOn)return;
  const steps=TSTEPS[kind];let i=0;tourOn=true;
  const root=document.createElement('div');root.id='tour';

  root.innerHTML='<div class="hole"></div><div class="bub"><i class="tail"></i><span class="in"><div class="top"><div class="mas"><svg viewBox="0 0 60 60"><path d="M30 6C45 6 54 17 54 31C54 46 44 55 30 55C16 55 6 46 6 31C6 17 15 6 30 6Z" fill="#ffe08a" stroke="#3a3a4a" stroke-width="3"/><circle cx="22" cy="29" r="3" fill="#3a3a4a"/><circle cx="38" cy="29" r="3" fill="#3a3a4a"/><path d="M23 38Q30 45 37 38" fill="none" stroke="#3a3a4a" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="36" r="4" fill="#ffb4a2" opacity=".7"/><circle cx="44" cy="36" r="4" fill="#ffb4a2" opacity=".7"/></svg></div><div class="tt"></div></div><div class="row"><span class="dots"></span><button class="nx"><span></span><svg viewBox="0 0 30 30"><path d="M5 15C11 14 17 16 24 15"/><path d="M18 8L25 15L18 22"/></svg></button></div></span><button class="cl" aria-label="close"><svg viewBox="0 0 16 16"><path d="M3 3L13 13M13 3L3 13"/></svg></button></div>';
  $('phone').appendChild(root);
  const hole=root.querySelector('.hole'),bub=root.querySelector('.bub'),tail=root.querySelector('.tail'),tt=root.querySelector('.tt'),dots=root.querySelector('.dots'),nx=root.querySelector('.nx');
  const end=done=>{root.remove();tourOn=false;if(done)tset(kind)};
  function place(){
    const [sel,key]=steps[i],P=$('phone').getBoundingClientRect();let r;
    if(sel==='pad'){r={left:P.width*.12,top:P.height*.16,width:P.width*.76,height:P.height*.3}}
    else{const b=document.querySelector(sel).getBoundingClientRect();r={left:b.left-P.left-8,top:b.top-P.top-8,width:b.width+16,height:b.height+16}}
    Object.assign(hole.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    tt.textContent=TOUR[lang][key];nx.firstChild.textContent=i<steps.length-1?TOUR[lang].next:TOUR[lang].ok;
    dots.innerHTML=steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');

    const bw=bub.offsetWidth,bh=bub.offsetHeight,cx=r.left+r.width/2,below=r.top+r.height/2<P.height*.55;
    const left=Math.max(12,Math.min(P.width-bw-12,cx-bw/2));

  root.querySelector('.cl').onclick=()=>{tset('off');end(false)};
  place();
}
