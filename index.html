<script>

// crop the doodle (with margin), send dark lines on white; remember the crop so the original lines can be laid back on top
function snapshot(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(s=>s.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)}));
  const PW=576,PH=1024,bw=Math.max(x1-x0,40),bh=Math.max(y1-y0,40);

const ZIG=(rx)=>{const p=[];for(let i=0;i<=6;i++)p.push([-rx*1.2+i*(rx*2.4/6),i%2?12:-12]);return p};

  else{const bh=410,by=LIM-bh;c.save();c.shadowColor='#0004';c.shadowBlur=22;c.shadowOffsetY=10;rectW(c,60,by,W-120,bh,paperInk,4,'#fffdf5f2');c.restore();
    c.save();c.shadowBlur=0;tape(c,W/2,by,200,52,-.05,'#ffb4a2aa');row(L[0],110,by+120,118,hw,paperInk,'left',W-220);
    [1,2,3].forEach(i=>row(L[i],110,by+205+(i-1)*72,56,bw,paperInk,'left',W-220));c.restore()}
  c.restore();
  return navInk;
}
function compose(img,poem){
  lastPoem=poem;
  const L=poem.split('\n').filter(Boolean);while(L.length<4)L.push('');
  const o=$('out');W=1080;H=Math.round(W*BH()/BW());o.width=W;o.height=H;
  const top=H*.105,bot=H*.875,avail=bot-top,s=Math.min(W*.78,avail-620),y0=top+(avail-(s+600))/2;
  const g={s,x0:(W-s)/2,y0,ty:y0+s+120};
  _s=tpl*977+13;
  if(img&&window._redraw){document.documentElement.style.setProperty('--ink',fullCard(o.getContext('2d'),img,L));return}
  TPLS[tpl](o.getContext('2d'),img,L,g);
  document.documentElement.style.setProperty('--ink',INKS[tpl]);
}

 pad:['Draw anything you feel on the blank space','在空白的地方，隨心畫下此刻的心情','空いているところに、今の気持ちを描いてね'],

const TSTEPS={draw:[['pad','pad'],['#draw .lang','lang'],['#draw .logo','story'],['#miracle','go']],result:[['#result .bottom','bar'],['#theme2','dot'],['#again','new']]};
const tget=k=>{try{return localStorage.getItem('mr_tour_'+k)==='1'}catch(e){return false}},tset=k=>{try{localStorage.setItem('mr_tour_'+k,'1')}catch(e){}};
let tourOn=false;
function runTour(kind){
  if(tget('off')||tget(kind+'2')||tourOn)return;
  const steps=TSTEPS[kind];let i=0;tourOn=true;
  const root=document.createElement('div');root.id='tour';
  
  root.innerHTML='<div class="hole"></div><div class="bub"><i class="tail"></i><span class="in"><div class="top"><div class="mas"><svg viewBox="0 0 60 60"><path d="M30 6C45 6 54 17 54 31C54 46 44 55 30 55C16 55 6 46 6 31C6 17 15 6 30 6Z" fill="#ffe08a" stroke="#3a3a4a" stroke-width="3"/><circle cx="22" cy="29" r="3" fill="#3a3a4a"/><circle cx="38" cy="29" r="3" fill="#3a3a4a"/><path d="M23 38Q30 45 37 38" fill="none" stroke="#3a3a4a" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="36" r="4" fill="#ffb4a2" opacity=".7"/><circle cx="44" cy="36" r="4" fill="#ffb4a2" opacity=".7"/></svg></div><div class="tt"></div></div><div class="row"><span class="dots"></span><button class="nx"><span></span><svg viewBox="0 0 30 30"><path d="M5 15C11 14 17 16 24 15"/><path d="M18 8L25 15L18 22"/></svg></button></div></span><button class="cl" aria-label="close"><svg viewBox="0 0 16 16"><path d="M3 3L13 13M13 3L3 13"/></svg></button></div>';
  $('phone').appendChild(root);
  const hole=root.querySelector('.hole'),bub=root.querySelector('.bub'),tail=root.querySelector('.tail'),tt=root.querySelector('.tt'),dots=root.querySelector('.dots'),nx=root.querySelector('.nx');
  const end=done=>{root.remove();tourOn=false;if(done)tset(kind+'2')};
  function place(){
    const [sel,key]=steps[i],P=$('phone').getBoundingClientRect();let r;
    if(sel==='pad'){r={left:P.width*.12,top:P.height*.16,width:P.width*.76,height:P.height*.3}}
    else{const b=document.querySelector(sel).getBoundingClientRect();r={left:b.left-P.left-8,top:b.top-P.top-8,width:b.width+16,height:b.height+16}}
    Object.assign(hole.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    tt.innerHTML=TOUR[key].map((t,k)=>`<div style="font-family:${TFONT[k]},cursive">${t}</div>`).join('');nx.firstChild.textContent=(i<steps.length-1?TOUR.next:TOUR.ok).join(' · ');
    dots.innerHTML=steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
    bub.style.animation='none';bub.offsetWidth;bub.style.animation='';
    bub.style.width=Math.min(P.width*.86,360)+'px';
    const bw=bub.offsetWidth,bh=bub.offsetHeight,cx=r.left+r.width/2,below=r.top+r.height/2<P.height*.55;
    const left=Math.max(12,Math.min(P.width-bw-12,cx-bw/2));
    bub.style.left=left+'px';bub.style.top=(below?r.top+r.height+26:r.top-bh-26)+'px';
    tail.style.left=Math.max(26,Math.min(bw-48,cx-left-11))+'px';
    tail.style.top=below?'-13px':'auto';tail.style.bottom=below?'auto':'-13px';
    tail.style.borderWidth=below?'3px 0 0 3px':'0 3px 3px 0';
  }
  nx.onclick=()=>{if(i<steps.length-1){i++;place()}else end(true)};
  root.querySelector('.cl').onclick=()=>{tset('off');end(false)};
  place();
}
